# This workflow generates the GitHub contribution snake animation.

name: Generate Snake

# Run this workflow every 24 hours and also allow manual execution.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Give the workflow permission to write generated files.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      # Generate the contribution snake SVG files.
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          # Generate both light and dark versions.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publish the generated files to the output branch.
      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
